            <style>
              .circle {
                width: 300px;
                height: 300px;
                background-color: #3f51b5;
                border-radius: 100%;

                display: flex;
                align-items: center;
                justify-content: center;
              }

              .rhombus {
                width: 180px;
                height: 180px;
                background-color: #ff9800;

                transform: rotate(45deg);

                display: flex;
                align-items: center;
                justify-content: center;
              }

              .triangle {
                width: 0;
                height: 0;

                border-left: 40px solid transparent;
                border-right: 40px solid transparent;
                border-bottom: 70px solid #e91e63;

                transform: rotate(-45deg);
